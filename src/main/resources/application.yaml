server:
  port: 8088
  servlet:
    context-path: /discovery-atm

spring:
  application:
    name: discovery-bank-atm-service
  datasource:
    url: jdbc:h2:file:./src/main/resources/data/discovery_atm;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
